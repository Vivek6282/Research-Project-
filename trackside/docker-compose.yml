version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: trackside_db
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackside}
      POSTGRES_USER: ${POSTGRES_USER:-trackside_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trackside_redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackside_backend
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file:
      - .env.docker
    environment:
      - DJANGO_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DATABASE_URL=postgres://${POSTGRES_USER:-trackside_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trackside}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
