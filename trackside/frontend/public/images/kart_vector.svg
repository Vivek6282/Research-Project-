  <path d="M 170 85 L 215 90 L 195 105 L 160 100 Z" fill="#3FA6E0" opacity="0.85"/>
  <!-- Rear Wing / Bumper -->
  <rect x="20" y="70" width="15" height="35" rx="3" fill="#E5473C"/>
  <!-- Kart Wheels -->
  <circle cx="55" cy="100" r="18" fill="#12181F" stroke="#3FA6E0" stroke-width="4"/>
  <circle cx="55" cy="100" r="8" fill="#7C8898"/>
  <circle cx="175" cy="100" r="18" fill="#12181F" stroke="#3FA6E0" stroke-width="4"/>
  <circle cx="175" cy="100" r="8" fill="#7C8898"/>
  <!-- Driver Helmet -->
  <circle cx="105" cy="40" r="14" fill="#F2A93B"/>
  <path d="M 108 34 L 117 38 L 117 44 L 105 44 Z" fill="#0A0E13"/>
  <!-- Steering Column -->
  <line x1="120" y1="55" x2="135" y2="70" stroke="#E7EDF3" stroke-width="3"/>
  <circle cx="135" cy="70" r="6" fill="none" stroke="#E7EDF3" stroke-width="2"/>
</svg>
