<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <defs>
    <linearGradient id="kartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA6E0"/>
      <stop offset="100%" stop-color="#33D17E"/>
    </linearGradient>
  </defs>
  <!-- Go-Kart Chassis Frame -->
  <path d="M 30 90 L 60 45 L 140 45 L 190 90 Z" fill="none" stroke="url(#kartGrad)" stroke-width="4" stroke-linejoin="round"/>
