# Render Blueprint for Trackside (free plan, one web service + one free database).
# Render: New > Blueprint > pick this repository. You are asked for the three "sync: false" values.
databases:
  - name: trackside-db
    plan: free
    databaseName: trackside
    user: trackside_user

services:
  - type: web
    name: trackside
    runtime: docker
    plan: free
    dockerfilePath: ./trackside/Dockerfile.render
    dockerContext: ./trackside
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trackside-db
          property: connectionString
      # Render adds the service's own *.onrender.com host automatically; localhost is kept for health checks
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      # Lets this hosted server run the Play demo itself (Coach only). The Coach's browser forwards the
      # stages to the bridge (Connect bridge). Set to "false" to switch the hosted demo off.
      - key: HOSTED_DEMO_ENABLED
        value: "true"
      # One finished sample (DEMO) session so the hosted site has something to show. Remove or set to
      # "false" to stop adding it (delete the "Sample Driver" in the Admin screen to remove it).
      - key: SEED_SAMPLE_DATA
        value: "true"
      # The first admin (see RENDER.md). Remove ADMIN_PASSWORD after your first login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
